[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgageops-ai"
version = "0.1.0"
description = "Document intelligence and AI assistance service for MortgageOps."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
