[package]
name = "mortgageops-ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "~1.53", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.43", features = ["serde"] }
thiserror = "2"
