name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all packages
        run: pnpm run typecheck:all

      - name: Test all packages
        run: pnpm run test:all

      - name: Production build
        run: pnpm run build:all

  python:
    name: Python AI service validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install AI service dependencies
        run: python -m pip install fastapi==0.141.1 pydantic==2.13.5 uvicorn==0.52.4

      - name: Compile Python sources
        run: python -m compileall app

  rust:
    name: Rust systems validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Check ledger service
        run: cargo check --manifest-path services/ledger-rust/Cargo.toml

      - name: Check NATS event bus
        run: cargo check --manifest-path services/event-bus-rust/Cargo.toml

      - name: Check WebAssembly rules
        run: cargo check --manifest-path services/rules-wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Format check
        run: |
          cargo fmt --manifest-path services/ledger-rust/Cargo.toml -- --check
          cargo fmt --manifest-path services/event-bus-rust/Cargo.toml -- --check
          cargo fmt --manifest-path services/rules-wasm/Cargo.toml -- --check

  go:
    name: Go integration validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/integration-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false

      - name: Test and build
        run: |
          go test ./...
          go build ./...

  elixir:
    name: Elixir realtime validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.5"
          otp-version: "27.3"
          version-type: loose

      - name: Fetch Elixir dependencies
        working-directory: services/realtime-elixir
        run: mix deps.get

      - name: Compile
        working-directory: services/realtime-elixir
        run: mix compile --warnings-as-errors
