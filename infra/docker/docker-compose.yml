services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mortgageops
      POSTGRES_USER: mortgageops
      POSTGRES_PASSWORD: mortgageops_dev_only
    ports:
      - "5432:5432"
    volumes:
      - mortgageops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgageops -d mortgageops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - mortgageops-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  ai:
    build:
      context: ../..
      dockerfile: infra/docker/ai.Dockerfile
    ports:
      - "8000:8000"

volumes:
  mortgageops-postgres:
  mortgageops-redis:
